# Configuration file




##########################################################################################################
# surfaces
#--------------------------------------------------------------------------------------------------------#
# Which blocks wear at all, and how the mod decides. Detection runs at startup, writes what it found back into the family lists below, and never removes an entry - so the exclude list here is the way to take a block back out, and it is consulted by both the detection path and the hand-written lists.
##########################################################################################################

surfaces {
    # Scan every installed block at startup and sort grass-, dirt-, sand-, gravel- and stone-like blocks into families automatically. This is what makes the mod cover the pack's modded terrain without naming each block by hand. Run /trmt surfaces to see what it found; per-family detection toggles and manual block lists live under the families category. [default: true]
    B:autoDetect=true

    # Blocks that must never erode, whatever detection concludes. Registry names only, no metadata. Tilled soil is here because a field someone hoed should stay a field; paths are deliberately not, and resist wear instead — see families.dirt.resistantBlocks. Natura's double grass slab is a shape somebody built out of turf rather than ground that grew, and Amun-Ra's red grass turns itself into methane dirt anywhere but its own world, so wearing either is showing you something that is about to stop existing.
    S:exclude <
        minecraft:mycelium
        minecraft:soul_sand
        minecraft:farmland
        etfuturum:farmland
        minecraft:tilled_field
        Natura:GrassSlabDouble
        GalacticraftAmunRa:tile.baseGrass
     >

    # Also scan for ground cover at startup: the thin plant-material decorations that grow out of whatever is under them - tall grass, flowers, saplings, dead bushes and the modded equivalents. These are not surfaces and never wear; the list only decides what trampling.groundCover is allowed to knock down. What it finds is written into groundCoverBlocks below, the same way the family lists are filled in. [default: true]
    B:groundCoverAutoDetect=true

    # Blocks that count as ground cover, filled in by detection and yours to add to. Registry names, optionally with a metadata suffix - 'BiomesOPlenty:foliage:15' names the dead leaf pile alone, where 'BiomesOPlenty:foliage' names all sixteen plants that block holds. Detection always claims all sixteen, so a suffix is only worth writing once autoDetect is off. Use groundCoverExclude to take a block back out; removing it from here only sticks with detection off, because detection would put it straight back.
    S:groundCoverBlocks <
        minecraft:beetroots
        minecraft:brown_mushroom
        minecraft:cactus
        minecraft:carrots
        minecraft:deadbush
        minecraft:double_plant
        minecraft:melon_stem
        minecraft:nether_wart
        minecraft:potatoes
        minecraft:pumpkin_stem
        minecraft:red_flower
        minecraft:red_mushroom
        minecraft:reeds
        minecraft:sapling
        minecraft:tallgrass
        minecraft:waterlily
        minecraft:wheat
        minecraft:yellow_flower
     >

    # Blocks that must never be treated as ground cover, whatever detection concludes. Registry names only, no metadata. Empty by default: stalks are deliberately included, so a cane or a cactus standing on ground that drops away comes down in full rather than hanging there. Put a name here for anything a pack would rather keep - the entry wins over detection, which is what makes it useful, because removing a name from groundCoverBlocks only sticks while detection is off.
    S:groundCoverExclude <
     >

    # Ground cover that holds its square rather than coming off it, filled in by detection and yours to add to. Saplings and flowers are found automatically; a modded herb or a magical bloom that ought to be spared is one line here. Same format as the lists above - registry names, optionally with a metadata suffix. Anything named here that is not ground cover in the first place is ignored, because holding is one of two answers to what happens when the ground gives way and a block that was never going to be asked cannot answer either.
    S:groundCoverHoldsBlocks <
        minecraft:red_flower
        minecraft:sapling
        minecraft:yellow_flower
     >

    # Cover that must never be treated as holding, whatever detection concludes. The way to make a sapling break with everything else rather than hold its ground.
    S:groundCoverHoldsExclude <
     >

    # Whether a map draws worn ground differently from ground nobody has crossed. On, a worn square is drawn in a colour that has travelled toward whatever that ground is turning into - a turf path leaves green and arrives at earth in step with how far along its run it has walked - and darkened by how heavily it has been used. Which is a map that answers 'where do people go' as well as 'what is this made of', and it is why a road shows up on a minimap at all. Off, every square is drawn as the material it started as, and the darkening a world-reading map is given through client.mapWearThroughTint goes with it. One correction still reaches such a map with this off, because it is not wear: a modded turf has its tint put right, so a path through it does not read as a green stripe. What a map with no per-position colour handler can do is coarser and cannot be helped: the vanilla map item works from a fixed palette of sixty-four colours with no darker sibling to pick, so it is given the right material and nothing about how worn it is. JourneyMap is asked per position and gets all of it; a map that reads the world, Xaero's Minimap among them, gets the darkening. [default: true]
    B:mapTracksWear=true

    # How far a fully worn square is darkened on a map, as a fraction of the colour it would otherwise be. The darkening is spread evenly over every gradation the ground has - eighty for most families - so this also sets how much one step of wear is worth: at the default, about eight tenths of one per cent each. Raise it to tell the levels apart more easily, at the cost of a worn road reading as a darker material rather than as the same material worn. There is a floor on what can be shown either way: eight-bit colour has only so many values between a block's own shade and a fraction of it, and on already-dark ground several gradations will land on the same one however wide this is set. Nought means no darkening at all, and now genuinely does: it used to be read as a request for the default, so a pack that turned this off silently got it back.
    D:mapWearDarkening=0.62

    # Upper bound on how many distinct block faces get their own generated wear textures. Anything past it falls back to the family's vanilla-derived set, which is why a modded block would wear into a vanilla one. Metadata values that draw the same face share a set, so this counts faces rather than block states. It is not the only limit. The block atlas is measured at every stitch, and when the faces this lets through would not fit in the room it actually has, the ramp is drawn more coarsely first, never below sixteen gradations, and past that the faces last in registry-name order fall back too - so once the log says the atlas stopped the plan, raising this changes nothing. Zero gives no block its own wear at all. [range: 0 ~ 4096, default: 1024]
    I:maxTexturedSurfaces=1024

    # Write everything detection finds into the per-family blocks lists, so you can see what it decided. To drop one block while leaving detection on, add it to the exclude list below; removing it from a blocks list only sticks once autoDetect is off, because detection would otherwise put it straight back. [default: true]
    B:writeDetectedToConfig=true
}
