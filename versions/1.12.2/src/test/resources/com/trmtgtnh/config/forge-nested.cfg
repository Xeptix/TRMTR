        D:wetRecoverySpeed=2.0
    }

    ##########################################################################################################
    # sand
    #--------------------------------------------------------------------------------------------------------#
    # Everything about how sand wears: whether it does, how many gradations it goes through, how deep it sinks under foot, how long it takes to recover, and which blocks count as it. The blocks list is filled in by startup detection and is also yours to edit - see the surfaces heading for how removing an entry actually works.
    ##########################################################################################################

}
