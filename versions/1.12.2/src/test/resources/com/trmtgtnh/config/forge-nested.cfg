# Configuration file




##########################################################################################################
# families
#--------------------------------------------------------------------------------------------------------#
# One heading per kind of surface. Each decides whether that kind wears, how many gradations it wears through, how deep it sinks, how long it takes to grow back, and which blocks count as it. This is where to make stone all but permanent and sand wear in a dozen crossings.
##########################################################################################################

families {

    ##########################################################################################################
    # grass
    #--------------------------------------------------------------------------------------------------------#
    # Everything about how grass wears: whether it does, how many gradations it goes through, how deep it sinks under foot, how long it takes to recover, and which blocks count as it. The blocks list is filled in by startup detection and is also yours to edit - see the surfaces heading for how removing an entry actually works.
    ##########################################################################################################

    grass {
        # Whether startup detection may classify installed blocks into this family. Turn off and use the list below to control it by hand. [default: true]
        B:autoDetect=true

        # Blocks treated as grass. Detection fills this in with what it found, so it doubles as a record of what is actually being affected; anything you add by hand is kept. Format: modid:block, modid:block:meta, or modid:block:* for every metadata. Removing an entry only sticks once surfaces.autoDetect is off, because with it on detection puts the block straight back — use surfaces.exclude for that instead.
        S:blocks <
            minecraft:grass
            minecraft:nether_wart_block
         >

        # How the price of a gradation changes as this surface wears further down its run. Every step used to cost the same, which is not what any of these surfaces do and is why early wear read as inert: the gradation you actually watch appear, the first, cost exactly as much as the last. flat holds one price the whole way, which is right for dressed stone - it does not compact underfoot, and the hundredth scuff costs what the first did. sod starts cheap and ends about four fifths dearer, for turf that tears at a touch over earth that is packed and rooted and does not. settle climbs to two and a half times, for sand and gravel, which displace under the first passes and then settle into a shape they have already found. pack climbs fourfold and stops climbing three quarters of the way along, for snow: one footfall in fresh powder is a whole gradation, what it leaves is packed snow and a different substance, and once thoroughly packed there is nothing left to compress. glaze climbs twelvefold in a straight line and never levels off at all, for ice, which does not compact and settle but merely polishes what is left, so every gradation is dearer than the one before it right to the end. Whichever is chosen, the total does not move. The multipliers over a whole run average to exactly one, so a curve only redistributes what the run costs - it can never quietly make a family easier or harder while appearing to be a change of shape, and every figure in the wear table survives changing it. What changes is where the cost sits: how quickly a path first shows, against how hard it is to drive one all the way down. [default: sod]
        S:costCurve=sod

        # Whether grass surfaces erode at all. [default: true]
        B:enabled=true

        # In-game days this family's stage must go untouched before it steps back. What a fully worn path costs altogether is this times the length of the family's whole run, and that run is longer than the stages figure above suggests: each pixel of depth adds layersPerDepth gradations of its own, and a family with no depth of its own takes both of those figures from the first surface it wears through into, because the ground beneath is then the only rut it can have. Which is why turf, whose maxSinkPixels is nought, still runs eighty gradations - sixteen of thinning green and then sixty-four down through the earth - and takes a hundred and twenty-five days to go rather than the twenty-five its own stages alone would come to. Turn general.grassWearsThroughToDirt off and there is nothing left for it to borrow: the run stops at sixteen, and twenty-five days is then the honest figure. Earth is one gradation shorter than the arithmetic gives, because a ghost showing no wear at all is indistinguishable from the dirt it is lying on and so its first layer is skipped; its run is seventy-nine rather than eighty, which is why its default is written as a hundred days divided by seventy-nine and comes out at a hundred exactly. All of this holds while general.wearPaceFollowsTheGround is on, which is how it ships, and that switch is what keeps every gradation of a run mended at the rate of the ground the path is made of rather than at the rate of whatever it happens to be drawn as by then. The wear table in game works the total out for every family from these same numbers and is the place to read it after changing one. Healing is applied from the world clock when a chunk loads, so a chunk nobody has visited still recovers. This is the family's own figure and is not worked out from its wear cost: what it takes to mark a surface and what it takes for that mark to fade are genuinely different questions, and snow against sand is the pair that proves it.
        D:healDaysPerStage=1.5625

        # Whether this surface recovers only while it is being rained on - or snowed on, for snow and ice, which is the same weather asked of a colder place. Off, which is how every family ships, it recovers on the clock alone. On, the days it is owed still bank up exactly as they did, so nothing is lost by a dry spell and a chunk nobody has visited for a month still holds every day of it; what changes is that the debt is only paid while something is actually falling, and paid a gradation at a time rather than all at once. Read the weather heading before switching this on: three settings there decide whether sheltered ground, dry biomes and weatherless dimensions are excluded, and each of those is a place where this can quietly mean never. [default: false]
        B:healsOnlyWhenWet=false

        # How many visual gradations this family shows between one pixel of sinking and the next. The first run, before anything has sunk, uses the longer 'stages' count instead: that is the wear people actually watch, and it earns the detail. [range: 1 ~ 16, default: 8]
        I:layersPerDepth=8

        # How far this family's most worn stage physically sinks, in sixteenths of a block. 0 means it only ever discolours, unless it wears through into another surface: then it sinks as deep as the first of those, with that surface's layersPerDepth, which is how grass gets its rut. Whether that sinking is something you can walk down into or only something you can see is set by physicalDecay in the general category. [range: 0 ~ 15, default: 0]
        I:maxSinkPixels=0

        # How far along its run this surface may wear, as a fraction of the whole. 1 is the entire run from untouched to a rut half a block deep; 0.25 stops it about where a path reads as a path. The global general.maxWearFraction applies as well and whichever is lower wins, so a world can be capped once without editing every family.
        D:maxWear=1.0

        # What a worn grass surface may also be mended with, besides a block of itself, listed the same way as the blocks setting above. Grass and dirt both take plain dirt out of the box: grass is what the world grows and earth is what a player digs, so the repair should cost the commoner of the two. Prefix an entry with 'ore:' to name an ore dictionary group instead of a block. Empty means only a block of this surface will do - or, while healing.repairAnyInFamily is on, any block of the same family. Read by bone meal and the chunk tamper while bonemealCostsABlock is on, and by the golem always; the hand tamper pays in what the ground drops and does not read this list.
        S:repairBlocks <
            minecraft:dirt
         >

        # How much more wear the blocks listed above take before they advance a stage. Healing is unaffected, so a resistant surface recovers at the same rate as any other.
        D:resistance=8.0

        # Blocks in this family that wear far more slowly, listed the same way as the blocks setting above. Grass paths are here by default: someone already made that path on purpose, so it should stand up to traffic rather than being immune to it or degrading like turf.
        S:resistantBlocks <
         >

        # Whether slabs cut from grass wear too. There is nothing separate to tune: a slab walks the same chain at the same prices as a whole block of the same stuff, so it takes exactly as many crossings to wear through and exactly as long to recover, and the only difference is that the rut is drawn half as deep - half a block cannot lose eight pixels and still be there. Detection finds them the same way it finds everything else, by what the block is made of and what it is called with the shape word taken off, so a modded slab of this material is included without anybody naming it. [default: true]
        B:slabs=true

        # How many wear gradations this surface shows before it starts to sink. Once it does, each further pixel of depth gets 'layersPerDepth' gradations of its own, so the whole run from untouched to the deepest rut is usually stages + layersPerDepth * maxSinkPixels steps - eighty at the shipped figures, and forty-eight for ice, which sinks only half as far as the rest. Two of the headings here are not that arithmetic, and both are worth knowing before pricing anything against it. Grass has no depth of its own, because turf is a face rather than a substance, so it has no pixels to measure a run in and borrows them from the first surface it wears through into: with general.grassWearsThroughToDirt on, which is how it ships, grass runs earth's eighty steps rather than the sixteen this sum would give, and with that switch off there is nothing to borrow from and the chain really does stop dead at sixteen. Dirt is one step shorter than the sum rather than longer, because a ghost showing no wear at all is indistinguishable from the earth it is covering, so dirt's first layer is skipped and its run is seventy-nine. Both figures matter beyond curiosity, since a run's length is what healDaysPerStage below is multiplied by for how long a fully worn path takes to fade. The wear table in game reads the real chain for every family, so it is the place to check a run after changing anything here. [range: 1 ~ 16, default: 16]
        I:stages=16

        # Whether stairs cut from grass wear too, on the same terms as slabs above: the same chain, the same prices, and no depth at all. A stair states its own shape and never has a height clamped onto it, so it shows every gradation of its wear in its face and none of it underfoot - which is the one way a stair differs from the slab above, and is why it is worth its own switch. [default: true]
        B:stairs=true

        # Upper bound of the per-position random draw.
        D:thresholdMax=16.0

        # Wear needed to advance one stage, lower bound of the per-position random draw. The draw is what keeps path edges ragged instead of geometric.
        D:thresholdMin=8.0

        # Which wear look shapes this family's textures, all worked from the block's own pixels so any of them is safe on a block nobody drew art for. grass takes the cover off in patches and lets the face underneath show through, which is what turf does and what anything with a different underside does - podzol, mycelium, mossy stone over clean. crack dulls a surface down and splits it open, for stone that fissures and grimes over rather than polishing smooth, and crack_lite is the same run stopped a little over halfway along, so a face grimes and hairlines without ever breaking up. smooth flattens a surface toward its own average, for something that buffs shiny underfoot, and smooth_heavy takes rather more of the relief with it, leaving about a third of the light and dark the block began with. dirt rubs a growing patch of the surface away, which is what a trodden path is, and dirt_lite rubs a narrower and shallower one, leaving three fifths of the face exactly as it was. The last four do two of those in one look, and every id is written in the order its own halves run, so a file says what will happen without anybody reading the source. smooth_crack and smooth_dirt buff the whole face flat before cracking it or before wearing a track across part of it, because everything the second half of those aims at is read out of the surface it is handed and buffing afterwards would only close up the fissures and the track that had just been made. crack_dirt goes the other way round, and for a measured reason rather than a preference: a crack run last blurs a track's edge away to a quarter of what it was, while a track worn last leaves two fifths of the face carrying the fracture network exactly as a plain crack drew it, pixel for pixel. It is shown in the wear table as cracked rubbed, and crack_dirt_lite is that same run stopped early - the identical call with the eased progress at 0.55 of itself and nothing else altered, so every picture it draws is one crack_dirt genuinely passes through, pixel for pixel. It is shown in the wear table as cracked rubbed lite. dirt is what anything unrecognised falls back to - including the older sand and polish names, which are still read so that no file breaks. Read by your own client and by nobody else, so this is your choice on somebody else's server as much as in a world of your own, and a server's copy of this key changes nothing for anybody. Change this to experiment: a family's whole look follows from it. [default: grass]
        S:wearPattern=grass

        # How strongly the pattern is applied, 0 to 1. Lower values leave more of the block's original character showing through.
        D:wearStrength=1.0

        # Which surfaces this one exposes as it wears through, named the way the headings here name them - grass, dirt, sand, gravel, stone, cobble, snow, ice, nether, end - and listed in the order the ground reaches them. Stone shows cobble, then the grit that broke off it, then the earth the road was laid on; grass shows the earth it was growing out of. The pixels of depth this family sinks are shared out between however many are listed, earliest first, so the list changes what a rut looks like on the way down and changes neither how many steps it takes to get there nor what any of them costs. A name that is this family's own, a name nothing matches, and a family that is switched off are all skipped. Empty means the ground hollows out as itself, which is what sand and snow do. Turned off wholesale by general.wearThroughToOtherSurfaces - except for grass, which has no depth of its own to hollow out and so answers to general.grassWearsThroughToDirt instead.
        S:wearsThroughTo <
            dirt
         >

        # How much faster this surface recovers while rain is actually falling on it. One is no difference at all and is what stone, cobble, netherrack and end stone ship with; two, which is what turf, earth, sand and gravel ship with, means a rut mends in half the untouched days while it is raining on it. Unlike the healsOnlyWhenWet switch above, this can never mean never - it is a discount rather than a gate, so ground the rain cannot reach simply does not earn it and mends at its ordinary rate, and anything under one is read as one. Whether rain is reaching a particular square is decided by the same three settings under the weather heading that the switch above uses: an open sky, a biome that has weather, and a dimension that has any. A family that IS waiting for weather does not also get the discount, because that would be paying for the same storm twice.
        D:wetRecoverySpeed=2.0
    }

    ##########################################################################################################
    # dirt
    #--------------------------------------------------------------------------------------------------------#
    # Everything about how dirt wears: whether it does, how many gradations it goes through, how deep it sinks under foot, how long it takes to recover, and which blocks count as it. The blocks list is filled in by startup detection and is also yours to edit - see the surfaces heading for how removing an entry actually works.
    ##########################################################################################################

