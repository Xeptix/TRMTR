// This project's own additions to the template buildscript, applied last.
//
// Three things the 1.7.10 edition got from the GTNH convention plugins and this template does not
// provide: a version taken from the nearest git tag, a jar named for the Minecraft version it is
// built against, and the licence files carried inside the jar.

apply from: 'gradle/scripts/helpers.gradle'

// The version itself is settled in gradle/scripts/version.gradle, which has to run before this
// file because the Tags class, mcmod.info and the jar's name all read the property during the
// template's own configuration.

// ---------------------------------------------------------------------------
// The jar carries the Minecraft version in its name
// ---------------------------------------------------------------------------
//
// Gradle composes a jar name as <archivesName>-<version>-<classifier>.jar, so the Minecraft version
// rides in the base name and the loader in the classifier: trmtr-1.12.2-0.9.217-forge.jar. The point
// is that several of these sit in a downloads folder together and say which is which without being
// opened - and from 1.16.5 on that matters more than it did, because one body of code there produces
// a Forge jar and a Fabric jar which cannot both be called the same thing.
//
// The loader suffix arrived at 0.9.217. 0.9.216 was published without it.

base {
    archivesName.set('trmtr-1.12.2')
}

// On the reobfuscated jar and not on `jar`, which was the first attempt and was wrong. `jar` produces
// the development jar, against readable names; `reobfJar` takes that and writes the one a player
// installs. Classifying `jar` renamed the intermediate and left the shippable one unclassified, which
// was caught only by noticing that the unclassified jar was byte-for-byte the size of the one already
// published. So the loader goes on the artifact that ships, and the intermediate is labelled `dev` so
// the two can never be confused in build/libs again.
jar {
    archiveClassifier.set('dev')
}

reobfJar {
    archiveClassifier.set('forge')
}

// ---------------------------------------------------------------------------
// The licences travel inside the jar
// ---------------------------------------------------------------------------
//
// Copied from the repository root rather than kept as a second copy under resources, because a
// second copy is a copy that goes stale. ATTRIBUTION.md in particular is the record of
// modifications that CC BY-NC 4.0 4(a)(1)(B) requires to travel with the work, so a stale one is a
// licence matter rather than an untidiness.

processResources {
    from(rootDir) {
        include 'LICENSE.md'
        include 'LICENSE_trmt'
        include 'LICENSE_forgedevenv'
        include 'ATTRIBUTION.md'
    }
}

// ---------------------------------------------------------------------------
// Where the other edition is, for the drift check
// ---------------------------------------------------------------------------
//
// This mod exists twice, and the two share the arithmetic that decides how ground wears. The
// copies are compared byte for byte by a test, and this is how that test is told where the other
// tree is. Read from an untracked file rather than written into the repository: a project that has
// to be checked out beside another one in order to build is a project nobody else can build, so
// where the file is absent the test simply skips.

def sibling = file('sibling.properties')
if (sibling.exists()) {
    Properties held = new Properties()
    sibling.withInputStream { held.load(it) }
    String other = held.getProperty('otherEdition', '').trim()
    if (!other.isEmpty()) {
        tasks.named('test', Test) {
            systemProperty 'trmt.other.edition', other
        }
    }
}

// ---------------------------------------------------------------------------
// The TRMTR API's example mod, on the development runs only
// ---------------------------------------------------------------------------
//
// The example mod (0.9.229, W3 spec 2.8, task T12) lives in the 1.7.10 tree's api/example/: its portable plugin and
// data in common/, and this edition's one registration class in 1.12.2/forge/. That tree is found through the same
// untracked sibling.properties the drift check reads, so this tree and its public repository build exactly as before
// where the file or the folder is absent. It is a source set of its own so that nothing a shipped jar takes - `jar`,
// `reobfJar`, `sourcesJar`, all of them the main source set's - can reach it, and its jar is written to build/example/,
// outside build/libs, where staging and the jar checks look. It compiles against the game and TRMTR's classes because
// the dev run needs both on one classpath; that it uses nothing of TRMTR's but trmtr-api, and that no shipped jar holds
// it, are checked by guards in the 1.7.10 tree's tools.
//
// FML 1.12.2 finds a mod in any jar on a development run's classpath (ModDiscoverer.findClasspathMods examines every
// file of the class loader's parent sources that is not a known library), so the example is loaded as the separate mod
// it is, with its own jar as its source: TRMTR reads its plugin.json and data from that jar as it would a player's.
def exampleHome = null
if (sibling.exists()) {
    Properties heldForExample = new Properties()
    sibling.withInputStream { heldForExample.load(it) }
    String otherTree = heldForExample.getProperty('otherEdition', '').trim()
    if (!otherTree.isEmpty() && new File(otherTree, 'api/example/1.12.2/forge').isDirectory()) {
        exampleHome = new File(otherTree, 'api/example')
    }
}
if (exampleHome != null) {
    sourceSets {
        example {
            java.srcDirs = [new File(exampleHome, 'common/java'), new File(exampleHome, '1.12.2/forge/java')]
            resources.srcDirs = [new File(exampleHome, 'common/resources'), new File(exampleHome, '1.12.2/forge/resources')]
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        }
    }

    def exampleJar = tasks.register('exampleJar', Jar) {
        description = 'The TRMTR API example mod, for the development runs only.'
        from(sourceSets.example.output)
        archiveFileName.set('example-1.12.2-forge.jar')
        destinationDirectory.set(layout.buildDirectory.dir('example'))
    }

    ['runClient', 'runServer'].each { taskName ->
        tasks.named(taskName, JavaExec).configure { JavaExec task ->
            task.classpath(exampleJar)
        }
    }
}
