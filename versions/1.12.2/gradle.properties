# Gradle Properties
org.gradle.jvmargs = -Xmx3G

# Source Options
# Off deliberately. The 1.7.10 source this is ported from is written in explicit pre-8 style
# throughout - no lambdas, no diamonds, no var - so Jabel would buy nothing, and a plain Java 8
# toolchain is one less thing between a build failure and its cause.
use_modern_java_syntax = false
use_jetbrains_annotations = false

# Compilation Options
generate_sources_jar = true
generate_javadocs_jar = false

# Testing
enable_junit_testing = true
show_testing_output = false

# Mod Information
# The version is not read from here. It comes from the nearest git tag, set in
# gradle/scripts/extra.gradle, the same way the 1.7.10 edition versions itself - so a jar's name
# always names a commit somebody can go back to. This value is only the fallback for a tree with no
# tags in it at all.
mod_version = 0.0.0
root_package = com.trmtgtnh
# Kept the same as the 1.7.10 edition on purpose, and it is not cosmetic: the mod id is the
# namespace of every registry name, every lang key and every resource path. Keeping it means 235
# resource files and every translation copy across untouched, and the data files written for other
# mods land where they already land. Nothing is shared between the two editions at runtime - they
# are different Minecraft versions - so there is nothing for the shared name to collide with.
mod_id = trmtgtnh
mod_name = TRMT: Reimagined

# Mod Metadata
mod_description = Ground wears into paths along the routes that are actually walked, and grows back once they are not.
mod_url = https://github.com/Xeptix/TRMTR
mod_update_json =
mod_authors = Xeptix
mod_credits = Based on The Roads More Travelled by milkucha, used under CC BY-NC 4.0.
mod_logo_path =

# Mapping Properties
mapping_channel = stable
mapping_version = 39
use_dependency_at_files = true

# Run Configurations
minecraft_username = Developer
extra_jvm_args =
extra_tweak_classes =

# Maven Publishing
publish_to_maven = false
publish_to_local_maven = false
maven_name = ${mod_name}
maven_url =

# Publishing
release_type = release
publish_with_changelog = false
client_side = true
server_side = true

# Publishing to CurseForge
publish_to_curseforge = false
curseforge_project_id =
curseforge_debug = false

# Publishing to Modrinth
publish_to_modrinth = false
modrinth_project_id =
modrinth_sync_readme = false
modrinth_debug = false

# If any properties changes below this line, refresh gradle again to ensure everything is working correctly.

# Modify Minecraft Sources
change_minecraft_sources = false

# Tags
# Stated outright rather than composed from root_package and mod_id, which would have given
# com.trmtgtnh.trmtgtnh.Tags. This matches the 1.7.10 edition's generated class exactly, so the
# @Mod annotation that reads it ports without a change.
use_tags = true
tag_class_name = com.trmtgtnh.Tags

# Access Transformers
use_access_transformer = false
access_transformer_locations = ${mod_id}_at.cfg

# Mixins
# The config is declared in the jar manifest as MixinConfigs, which is what MixinBooter documents and
# what UniMixins is expected to read as well - expected, not known, so it is proven in a test instance
# before any document claims it. "A coremod of our own never" was the stance until 2026-10-07: see
# Coremods below.
use_mixins = true
mixin_booter_version = 11.13
generate_mixins_json = false
mixin_configs = mixins.trmtgtnh.json
mixin_connector_class =
mixin_refmap = mixins.trmtgtnh.refmap.json

# Coremods
# One, which transforms nothing: com.trmtgtnh.core.TrmtLoadingPlugin hands the mixin config to
# MixinBooter's early loader when something other than MixinBooter booted Mixin - JourneyMap 6 for
# 1.12.2 does, and then the manifest above is never read. Decided by the user on 2026-10-07.
is_coremod = true
coremod_includes_mod = true
coremod_plugin_class_name = com.trmtgtnh.core.TrmtLoadingPlugin

# AssetMover
use_asset_mover = false
asset_mover_version = 2.5
