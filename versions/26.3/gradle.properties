org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
# The Gradle JVM itself must be Java 25 for 26.x (settings.gradle says so if it is not).
org.gradle.java.home=X:/Prism/java/jdk-25.0.2+10

enabled_platforms=fabric,forge,neoforge

# Each read from its loader's own Maven on 2026-10-19, the newest for this game version: NeoForge's newest build, Forge's
# newest (no recommended build for 26.3 yet), Fabric API's newest on Modrinth.
minecraft_version=26.3
neoforge_version=26.3.0.94
forge_version=26.3-66.0.13
fabric_loader_version=0.19.5
fabric_api_version=0.164.0+26.3

mod_id=trmtgtnh
mod_name=TRMT: Reimagined
mod_version=0.9.228
mod_group=com.trmtgtnh
mod_license=CC BY-NC 4.0

# The mods this edition is compiled against, each read from its own official source (Modrinth's API, Cloth's and Mod
# Menu's own Mavens) on 2026-10-19, the newest build for 26.3. Cloth Config is optional on 26.x (decided): compiled
# against, never required. The One Probe and WTHIT have no 26.3 build (the decisions foresaw they stop before 26.3), so
# their plugins are compiled against the 26.2 builds' API - code ready for the day a 26.3 build is published.
cloth_version=26.3.159
modmenu_version=21.0.0
jade_neoforge_version=26.3.5+neoforge
jade_fabric_version=26.3.5+fabric
top_neoforge_version=26.2_neo-15.0.1
# The One Probe's first Fabric build, 26.2's (Modrinth, read 2026-10-19).
top_fabric_version=26.2-15.0.1-fabric
wthit_neoforge_version=neo-20.0.0
wthit_forge_version=forge-20.0.0
wthit_fabric_version=fabric-20.0.0
