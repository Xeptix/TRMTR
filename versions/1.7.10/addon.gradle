// Extra build configuration, applied on top of the GTNH convention.

// The storage-layer tests are JUnit 5. Without this the platform is never engaged and the
// test task reports "no tests discovered" rather than running them.
tasks.named('test', Test) {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }

    // Several tests here read files rather than classes - the manual and the store copy for the
    // figures they quote, the source for the promises that are only visible in the text. Gradle
    // cannot see that from a classpath, so editing one of those documents left this task UP-TO-DATE
    // and the guard simply did not run: watched happen on 2026-10-05, with the manual's trophy count
    // deliberately made wrong and the test reporting success. A test that quietly does not run is
    // worse than no test.
    inputs.files(
        fileTree(rootProject.projectDir) {
            include 'README.md'
            include 'docs/*.md'
            include 'src/main/java/**'
            include 'src/main/resources/**'
        })
        .withPropertyName('theFilesTheseTestsRead')
        .withPathSensitivity(PathSensitivity.RELATIVE)

    // Where the 1.12.2 edition's tree is, for the test that compares the two copies of the portable
    // core. Read from an untracked file rather than written here: a repository that has to be
    // checked out beside another one to build is a repository nobody else can build, so on a machine
    // with only this tree the file is simply absent and that test skips.
    def sibling = rootProject.file('sibling.properties')
    if (sibling.exists()) {
        Properties held = new Properties()
        sibling.withInputStream { held.load(it) }
        String other = held.getProperty('otherEdition', '').trim()
        if (!other.isEmpty()) {
            systemProperty 'trmt.other.edition', other
        }
    }
}

// The three files a redistributor is obliged to ship travel with the jar, copied from the root of
// the repository rather than kept as a second set beside the source. Two copies meant keeping them
// in step by remembering to, and what had actually happened is that the record of modifications the
// licence asks to travel with the work sat a year behind the one anybody would read on the repo.
// A copy cannot drift.
processResources {
    from(rootProject.file('LICENSE.md'))
    from(rootProject.file('LICENSE_trmt'))
    from(rootProject.file('ATTRIBUTION.md'))
}

// The loader rides in the jar's name from 0.9.217 on.
//
// Gradle composes <archivesName>-<version>-<classifier>.jar, so the Minecraft version stays in the
// base name set by customArchiveBaseName and the loader goes in the classifier:
// trmtr-1.7.10-0.9.217-forge.jar. The point is that several of these sit in a downloads folder
// together and say which is which without being opened - and from the 1.16.5 edition on it stops
// being a convenience, because one body of code there produces a Forge jar and a Fabric jar that
// cannot both be called the same thing.
//
// 0.9.216 was published without it.
//
// On the reobfuscated jar and not on `jar`, which was the first attempt and was wrong. `jar` produces
// the development jar, against readable names; `reobfJar` takes that and writes the one a player
// installs. Classifying `jar` renamed the intermediate and left the shippable one unclassified -
// caught only by noticing that the unclassified jar was the exact size of the one already published.
// The intermediate is labelled `dev` so the two cannot be confused in build/libs again.
jar {
    archiveClassifier.set('dev')
}

reobfJar {
    archiveClassifier.set('forge')
}

// The verification harness is off in a plain run and has to be asked for, which is the whole point of
// its being gated: it opens a world, drives the player and shuts the game down, and none of that may
// happen to somebody who merely launched the game. `-Pspike` sets the walking gate and `-Pshots` adds
// the photographing. Both are passed by tools/run_client.sh rather than typed.
//
// A JavaExec forks its own JVM, so a -D on the Gradle command line sets the property on Gradle and not
// on the game - which is why this exists at all rather than the script simply passing one through. Word
// for word the 1.12.2 edition's block; the point of this harness is that the three editions are driven
// identically, and that starts with how they are switched on.
['runClient', 'runServer'].each { taskName ->
    tasks.named(taskName, JavaExec).configure { JavaExec task ->
        if (project.hasProperty('spike')) {
            task.systemProperty('trmt.spike.walk', 'true')
        }
        if (project.hasProperty('shots')) {
            task.systemProperty('trmt.spike.shots', 'true')
        }
        // Which parts of the run are wanted - walk, show, demo1, demo2 - so one of them can be
        // refreshed on its own. Nothing given means all of them. See the harness's wanted().
        if (project.hasProperty('only')) {
            task.systemProperty('trmt.spike.only', project.property('only').toString())
        }
        // The size this run photographs at, so one comparison sheet never tiles two of them.
        //
        // A Prism instance takes its window from the launcher's instance.cfg, and a dev run has no
        // launcher to ask - so the game is handed its own --width and --height here. Both halves are
        // set by tools/window_size.sh, which writes the chosen size where every edition's scripts
        // read it, and the catalogue refuses to keep a target that photographed at another size.
        if (taskName == 'runClient' && project.hasProperty('window')) {
            def size = project.property('window').toString().split('x')
            task.args('--width', size[0], '--height', size[1])
        }
        // The heap this run is allowed, so a dev run counts against the same budget as an instance.
        // instance.cfg caps the ten Prism instances and reaches none of the four dev runs, which
        // would otherwise take whatever Gradle's default is while four games ran beside them.
        if (project.hasProperty('memory')) {
            task.maxHeapSize = project.property('memory').toString() + 'm'
            task.minHeapSize = '512m'
        }
    }
}
