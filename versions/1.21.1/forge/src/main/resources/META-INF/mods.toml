modLoader = "javafml"
loaderVersion = "[52,)"
license = "CC BY-NC 4.0"
issueTrackerURL = "https://github.com/Xeptix/TRMTR/issues"

[[mods]]
modId = "trmtgtnh"
version = "${version}"
displayName = "TRMT: Reimagined"
displayURL = "https://github.com/Xeptix/TRMTR"
authors = "Xeptix"
credits = "This version by Xep. Based on The Roads More Travelled by milkucha (https://github.com/milkucha/trmt), Copyright (c) 2026 milkucha, licensed CC BY-NC 4.0 (https://creativecommons.org/licenses/by-nc/4.0/) - see LICENSE_trmt for the full text and its disclaimer of warranties in Section 5. This is a modified work: carried to NeoForge, Forge and Fabric 1.21.1 by way of 1.7.10, 1.12.2, 1.16.5 and 1.20.1 and re-architected so wear is server-side data painted client-side. Unofficial and non-commercial; not produced, endorsed or supported by milkucha. Full notice in LICENSE.md and ATTRIBUTION.md."
description = '''
Ground wears into paths along the routes you actually walk, and grows back once you stop using them.

Wear is kept as server-side data and painted on your client as ghost blocks. No block is ever written
into the world, so this can be switched off for one player, disabled across a server, or deleted
outright without a square of terrain having changed.
'''

[[dependencies.trmtgtnh]]
    modId = "forge"
    mandatory = true
    versionRange = "[52,)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.trmtgtnh]]
    modId = "minecraft"
    mandatory = true
    versionRange = "[1.21.1,1.21.2)"
    ordering = "NONE"
    side = "BOTH"

# Cloth Config, whose screen is the other of this mod's two settings screens. Required until 0.9.227,
# when the Cloth screen was the only one; optional from 0.9.228 (Xep: "If the user has it, it uses
# those (i.e Cloth), otherwise it falls back to our own in-house screen"): a game without it starts,
# and the Config button asks ConfigScreens, which builds Cloth's screen only where Cloth is loaded.
# Declared, not mandatory, rather than left out, so a Cloth too old for this game is refused by the
# loader, by name, rather than met at the button.
#
# CLIENT rather than BOTH, because nothing outside the screen names it. cloth_config, with an
# underscore: from Forge 1.17 a mod id may hold no hyphen, and Cloth's Forge jar renamed itself. The
# floor is set as every jar's is, by trying older ones in a game (docs/DEPENDENCY-FLOORS.md in the
# 1.7.10 tree): the range admits Cloth 15, the line built for 1.21.1.
[[dependencies.trmtgtnh]]
    modId = "cloth_config"
    mandatory = false
    versionRange = "[15.0.130,)"
    ordering = "NONE"
    side = "CLIENT"
