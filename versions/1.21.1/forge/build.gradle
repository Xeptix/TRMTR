// The Forge jar, for Forge 52 on Minecraft 1.21.1. Outside Architectury's own 1.21.1 template, which offers Fabric and
// NeoForge; built by its Loom all the same - the first spike's question.

plugins {
    id "com.gradleup.shadow"
}

architectury {
    forge()
}

loom {
    mixin {
        defaultRefmapName = "trmtgtnh-forge-refmap.json"
    }
    // The shared access widener, turned into Forge's access transformer for this jar and applied in the dev run.
    accessWidenerPath = project(":common").loom.accessWidenerPath
    forge {
        mixinConfig "trmtgtnh-common.mixins.json"
        mixinConfig "trmtgtnh-forge.mixins.json"
        convertAccessWideners = true
        extraAccessWideners.add loom.accessWidenerPath.get().asFile.name
    }
}

configurations {
    common
    shadowBundle
    compileClasspath.extendsFrom common
    // Not runtimeClasspath, unlike 1.20.1's Forge module: Forge 52's module layer refuses a package two modules
    // export, and a dev run then held the common module twice - through Architectury's transformer (trmtr.dev) and
    // folded into this module's own (generated_...) - so it stopped at start with "Modules trmtr.dev and generated_...
    // export package com.trmtgtnh" (0.9.226, the first spike). The transformer's copy is the one a dev run needs.
    developmentForge.extendsFrom common
}

dependencies {
    forge "net.minecraftforge:forge:${rootProject.minecraft_version}-${rootProject.forge_version}"

    // MixinExtras, carried inside the jar: Forge 52's libraries hold Mixin and not it (read from its userdev config,
    // 0.9.226), as Forge 47's did, and the common module's librarian hook wraps an operation with it.
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:${rootProject.mixinextras_version}"))
    implementation(include("io.github.llamalad7:mixinextras-forge:${rootProject.mixinextras_version}"))

    // Cloth Config, whose screen is the other of this mod's two, at its 1.21.1 build for Forge - optional from 0.9.228
    // (decided), and kept on the development run so the rig can photograph both screens. The tooltip plugins are the
    // common module's: at 1.21.1 only WTHIT is built for Forge, and it finds its plugin through waila_plugins.json.
    modImplementation("me.shedaniel.cloth:cloth-config-forge:${rootProject.cloth_version}") {
        exclude group: "net.fabricmc"
        exclude group: "net.fabricmc.fabric-api"
    }

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowBundle project(path: ":common", configuration: "transformProductionForge")
}

processResources {
    inputs.property "version", project.version
    filesMatching("META-INF/mods.toml") {
        expand version: project.version
    }
    from(rootProject.projectDir) {
        include 'LICENSE.md'
        include 'LICENSE_trmt'
        include 'ATTRIBUTION.md'
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "dev-shadow"
}

remapJar {
    inputFile.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier = "forge"
}

// ---------------------------------------------------------------------------
// The TRMTR API's example mod, on the development runs only
// ---------------------------------------------------------------------------
//
// The example mod (0.9.229, W3 spec 2.8, carried in T19) lives in the 1.7.10 tree's api/example/: its portable plugin
// and data in common/, and this loader's one registration class in 1.21.1/forge/. That tree is found through the
// untracked sibling.properties at the root: its apiHome line where one is given (a worktree names its own 1.7.10
// worktree there), otherwise by following otherEdition to the tree each names in turn. Where neither leads to the folder, this tree and its public repository build exactly as before. It is a source
// set of its own so that nothing a shipped jar takes - shadowJar and remapJar read the main source set and the common
// module alone - can reach it, and its jar is written to build/example/, outside build/libs, where staging and the jar
// checks look. It compiles against the game and TRMTR's classes because the dev run needs both on one classpath; that
// it uses nothing of TRMTR's but trmtr-api, and that no shipped jar holds it, are checked by guards in the 1.7.10
// tree's tools.
//
// Forge 52 loads a second mod in development from the run's classpath: its ClasspathLocator (fmlloader 1.21.1-52.1.19,
// net/minecraftforge/fml/loading/moddiscovery/ClasspathLocator, read with javap; 1.20.1's own comment is about 47.4.27)
// takes every class path entry holding META-INF/mods.toml, but for the game's own, as a mod file of its own. TRMTR then
// reads its plugin.json and data from that jar as it would a player's.
def exampleHome = null
def exampleTrees = []
def exampleFirst = rootProject.file('sibling.properties')
if (exampleFirst.exists()) {
    Properties heldForExample = new Properties()
    exampleFirst.withInputStream { heldForExample.load(it) }
    String apiTree = heldForExample.getProperty('apiHome', '').trim()
    if (!apiTree.isEmpty()) exampleTrees << new File(apiTree)
    // otherEdition, then the tree each one names in turn, a few steps at most: 1.21.1 names 1.7.10.
    String olderTree = heldForExample.getProperty('otherEdition', '').trim()
    for (int step = 0; step < 3 && !olderTree.isEmpty(); step++) {
        File older = rootProject.file(olderTree)
        exampleTrees << older
        File olderSibling = new File(older, 'sibling.properties')
        olderTree = ''
        if (olderSibling.exists()) {
            Properties olderHeld = new Properties()
            olderSibling.withInputStream { olderHeld.load(it) }
            olderTree = olderHeld.getProperty('otherEdition', '').trim()
        }
    }
}
for (File tree : exampleTrees) {
    if (exampleHome == null && new File(tree, 'api/example/1.21.1/forge').isDirectory()) {
        exampleHome = new File(tree, 'api/example')
    }
}
if (exampleHome != null) {
    sourceSets {
        example {
            java.srcDirs = [new File(exampleHome, 'common/java'), new File(exampleHome, '1.21.1/forge/java')]
            resources.srcDirs = [new File(exampleHome, 'common/resources'), new File(exampleHome, '1.21.1/forge/resources')]
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        }
    }

    def exampleJar = tasks.register('exampleJar', Jar) {
        description = 'The TRMTR API example mod, for the development runs only.'
        from(sourceSets.example.output)
        archiveFileName.set('example-1.21.1-forge.jar')
        destinationDirectory.set(layout.buildDirectory.dir('example'))
    }

    // Loom's run tasks keep a classpath of their own, and classpath() adds to it whether the run goes by an argument
    // file or a bare class path (architectury-loom 1.17's AbstractRunTask, getInternalClasspath).

    // The example under the names a real game runs with: Mojang's on Forge 52, as this tree's shipped Forge jar carries. R3
    // is not played on 1.21.1 (W3 spec, R3), but a jar for a real game is how a mod's names are proved, so the task is
    // kept as 1.20.1 has it. Beside the development jar, under a name of its own, never in build/libs.
    def exampleRemap = tasks.register('remapExampleJar', net.fabricmc.loom.task.RemapJarTask) {
        description = 'The TRMTR API example mod under the names a real game runs with, for R3 only.'
        dependsOn exampleJar
        inputFile.set(exampleJar.flatMap { it.archiveFile })
        archiveFileName.set('example-1.21.1-forge-remapped.jar')
        destinationDirectory.set(layout.buildDirectory.dir('example'))
    }

    ['runClient', 'runServer'].each { taskName ->
        tasks.matching { it.name == taskName }.configureEach { JavaExec task ->
            task.dependsOn(exampleJar)
            if (taskName == 'runServer') task.dependsOn(exampleRemap)
            task.classpath(exampleJar)
        }
    }
}
