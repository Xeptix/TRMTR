// The NeoForge jar, for NeoForge 21.1 on Minecraft 1.21.1 - new in this edition. Forge's successor, with its own
// metadata file (neoforge.mods.toml) and its own event bus and registries.

plugins {
    id "com.gradleup.shadow"
}

architectury {
    neoForge()
}

loom {
    mixin {
        defaultRefmapName = "trmtgtnh-neoforge-refmap.json"
    }
    // The shared access widener, turned into NeoForge's access transformer for this jar (remapJar, below).
    accessWidenerPath = project(":common").loom.accessWidenerPath
}

configurations {
    common
    shadowBundle
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"

    // No MixinExtras carried here, unlike the Forge jar: NeoForge 21.1's own libraries hold it (mixinextras-neoforge
    // 0.5.5, read from its userdev config, 0.9.226), so the common module's librarian hook finds it at run time.

    // Cloth Config, whose screen is the other of this mod's two, at its 1.21.1 build for NeoForge, as the Forge module
    // has Forge's. Optional from 0.9.228 (decided); kept on the development run so the rig can photograph both screens.
    modImplementation("me.shedaniel.cloth:cloth-config-neoforge:${rootProject.cloth_version}") {
        exclude group: "net.fabricmc"
        exclude group: "net.fabricmc.fabric-api"
    }

    // The One Probe, compiled against and never carried: its lines are this module's (OneProbeTooltip), asked for
    // through its message as 1.20.1's Forge jar asked, so a pack without it never touches them.
    modCompileOnly "maven.modrinth:the-one-probe:${rootProject.top_neoforge_version}"

    // Distant Horizons' API, compile only and never shipped (0.9.229 W6 T17): that mod is LGPL-3.0, and the plugin
    // that names it (com.trmtgtnh.neoforge.dh) is loaded only where a player has it installed. From Modrinth's Maven; 7.2.0 is
    // the API inside DistantHorizons-3.3.3-1.21.1-fabric-neoforge.jar, one jar for Fabric and NeoForge.
    compileOnly "maven.modrinth:distanthorizonsapi:${rootProject.distanthorizons_api_version}"

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowBundle project(path: ":common", configuration: "transformProductionNeoForge")
}

processResources {
    inputs.property "version", project.version
    filesMatching("META-INF/neoforge.mods.toml") {
        expand version: project.version
    }
    from(rootProject.projectDir) {
        include 'LICENSE.md'
        include 'LICENSE_trmt'
        include 'ATTRIBUTION.md'
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "dev-shadow"
}

remapJar {
    inputFile.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier = "neoforge"
    // The shared access widener, written into the jar as NeoForge's access transformer.
    atAccessWideners.add(loom.accessWidenerPath.get().asFile.name)
}

// ---------------------------------------------------------------------------
// The TRMTR API's example mod, on the development runs only
// ---------------------------------------------------------------------------
//
// The example mod (0.9.229, W3 spec 2.8, carried in T19, as Forge's module has it) lives in the 1.7.10 tree's api/example/: its portable plugin
// and data in common/, and this loader's one registration class in 1.21.1/neoforge/. That tree is found through the
// untracked sibling.properties at the root: its apiHome line where one is given (a worktree names its own 1.7.10
// worktree there), otherwise by following otherEdition to the tree each names in turn. Where neither leads to the folder, this tree and its public repository build exactly as before. It is a source
// set of its own so that nothing a shipped jar takes - shadowJar and remapJar read the main source set and the common
// module alone - can reach it, and its jar is written to build/example/, outside build/libs, where staging and the jar
// checks look. It compiles against the game and TRMTR's classes because the dev run needs both on one classpath; that
// it uses nothing of TRMTR's but trmtr-api, and that no shipped jar holds it, are checked by guards in the 1.7.10
// tree's tools.
//
// NeoForge loads a second mod in development from the run's classpath: FML 4.0.45's UserdevLocator takes every system
// class path entry holding META-INF/neoforge.mods.toml or a manifest (DevEnvUtils.findFileSystemRootsOfFileOnClasspath),
// a jar or a folder, as a mod file of its own. TRMTR then reads its plugin.json and data from that jar as it would a
// player's.
def exampleHome = null
def exampleTrees = []
def exampleFirst = rootProject.file('sibling.properties')
if (exampleFirst.exists()) {
    Properties heldForExample = new Properties()
    exampleFirst.withInputStream { heldForExample.load(it) }
    String apiTree = heldForExample.getProperty('apiHome', '').trim()
    if (!apiTree.isEmpty()) exampleTrees << new File(apiTree)
    // otherEdition, then the tree each one names in turn, a few steps at most: 1.21.1 names 1.7.10.
    String olderTree = heldForExample.getProperty('otherEdition', '').trim()
    for (int step = 0; step < 3 && !olderTree.isEmpty(); step++) {
        File older = rootProject.file(olderTree)
        exampleTrees << older
        File olderSibling = new File(older, 'sibling.properties')
        olderTree = ''
        if (olderSibling.exists()) {
            Properties olderHeld = new Properties()
            olderSibling.withInputStream { olderHeld.load(it) }
            olderTree = olderHeld.getProperty('otherEdition', '').trim()
        }
    }
}
for (File tree : exampleTrees) {
    if (exampleHome == null && new File(tree, 'api/example/1.21.1/neoforge').isDirectory()) {
        exampleHome = new File(tree, 'api/example')
    }
}
if (exampleHome != null) {
    sourceSets {
        example {
            java.srcDirs = [new File(exampleHome, 'common/java'), new File(exampleHome, '1.21.1/neoforge/java')]
            resources.srcDirs = [new File(exampleHome, 'common/resources'), new File(exampleHome, '1.21.1/neoforge/resources')]
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        }
    }

    def exampleJar = tasks.register('exampleJar', Jar) {
        description = 'The TRMTR API example mod, for the development runs only.'
        from(sourceSets.example.output)
        archiveFileName.set('example-1.21.1-neoforge.jar')
        destinationDirectory.set(layout.buildDirectory.dir('example'))
    }

    // Loom's run tasks keep a classpath of their own, and classpath() adds to it whether the run goes by an argument
    // file or a bare class path (architectury-loom 1.17's AbstractRunTask, getInternalClasspath).

    // The example under the names a real game runs with: Mojang's on NeoForge 21.1. R3
    // is not played on 1.21.1 (W3 spec, R3), but a jar for a real game is how a mod's names are proved, so the task is
    // kept as 1.20.1 has it. Beside the development jar, under a name of its own, never in build/libs.
    def exampleRemap = tasks.register('remapExampleJar', net.fabricmc.loom.task.RemapJarTask) {
        description = 'The TRMTR API example mod under the names a real game runs with, for R3 only.'
        dependsOn exampleJar
        inputFile.set(exampleJar.flatMap { it.archiveFile })
        archiveFileName.set('example-1.21.1-neoforge-remapped.jar')
        destinationDirectory.set(layout.buildDirectory.dir('example'))
    }

    ['runClient', 'runServer'].each { taskName ->
        tasks.matching { it.name == taskName }.configureEach { JavaExec task ->
            task.dependsOn(exampleJar)
            if (taskName == 'runServer') task.dependsOn(exampleRemap)
            task.classpath(exampleJar)
        }
    }
}
