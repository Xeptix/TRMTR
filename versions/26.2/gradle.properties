org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
# The Gradle JVM itself must be Java 25 for 26.x (settings.gradle says so if it is not).
org.gradle.java.home=X:/Prism/java/jdk-25.0.2+10

enabled_platforms=fabric,forge,neoforge

# Each read from its loader's own Maven on 2026-10-18 and 2026-10-19, the newest for this game version: NeoForge's
# newest non-beta build, Forge's newest promoted (its recommended is 65.1.0), Fabric API's newest on Modrinth.
minecraft_version=26.2
neoforge_version=26.2.0.88
forge_version=26.2-65.1.5
fabric_loader_version=0.19.5
fabric_api_version=0.161.0+26.2

mod_id=trmtgtnh
mod_name=TRMT: Reimagined
mod_version=0.9.228
mod_group=com.trmtgtnh
mod_license=CC BY-NC 4.0

# The mods this edition is compiled against, each read from its own official source (Modrinth's API, Cloth's and Mod
# Menu's own Mavens) on 2026-10-19, the newest build for 26.2. Cloth Config is optional on 26.x (decided): compiled
# against, never required.
cloth_version=26.2.155
modmenu_version=20.0.3
jade_neoforge_version=26.2.10+neoforge
jade_fabric_version=26.2.11+fabric
top_neoforge_version=26.2_neo-15.0.1
# The One Probe's first Fabric build, 26.2's (Modrinth, read 2026-10-19).
