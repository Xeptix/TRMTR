org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true

# Each read from its loader's own Maven on 2026-10-13, the newest for this game version. The instances this edition is
# tested in carry the same, and the dependency floors (docs/DEPENDENCY-FLOORS.md in the 1.7.10 tree) find the oldest of
# each that still runs.
minecraft_version=1.20.1
forge_version=47.4.27
fabric_loader_version=0.19.5
fabric_api_version=0.92.12+1.20.1

# Mojang's own names with Parchment's parameter names over the game's decompiled sources, applied, as 1.16.5 does
# since 0.9.223. Changes nothing in the jar.
parchment_minecraft=1.20.1
parchment_version=2023.09.03

# MixinExtras: Fabric's loader carries it; Forge 47 does not, so the Forge jar carries it inside itself
# (jar-in-jar), its licence with it - decided 2026-10-13, "Bundle it in the jar".
mixinextras_version=0.5.5

# The mods this edition is compiled against, each read from its own official source on 2026-10-13: Cloth Config
# from its author's Maven, Mod Menu from Terraformers', the tooltip mods from Modrinth's.
cloth_version=11.1.136
modmenu_version=7.2.2
jade_forge_version=11.13.3+forge
jade_fabric_version=11.13.3+fabric
top_version=1.20.1-10.0.4
wthit_fabric_version=fabric-8.21.1

mod_id=trmtgtnh
mod_name=TRMT: Reimagined
mod_version=0.9.228
mod_group=com.trmtgtnh
mod_license=CC BY-NC 4.0
