// Root build for the 1.20.1 edition.
//
// Architectury Loom, as 1.16.5 uses, because this version too produces two jars - Forge and Fabric - from one body
// of code. The tree is laid out as 1.16.5's is (common, forge, fabric), because it is carried from 1.16.5's code: the
// same rendering era, the same multi-loader shape, Mojang's names (docs/MODERN-PORTS-PLAN.md, Phase 2, in the 1.7.10
// tree). What it is measured against is 1.7.10, not 1.16.5: see sibling.properties and CoreMatchesOtherEditionTest.

plugins {
    id "architectury-plugin" version "3.5-SNAPSHOT"
    id "dev.architectury.loom" version "1.17-SNAPSHOT" apply false
    // Each loader's jar carries the common module's classes inside it: `common` is published nowhere and a player
    // installs one jar. Shadow folds them in; GradleUp's, because the older plugin 1.16.5 uses does not run on the
    // Gradle this tree builds with.
    id "com.gradleup.shadow" version "9.6.1" apply false
}

architectury {
    minecraft = project.minecraft_version
}

subprojects {
    apply plugin: "dev.architectury.loom"

    loom {
        silentMojangMappingsLicense()

        // The verification harness is off in a plain run and has to be asked for, as in 1.16.5: -Pspike, -Pwalk,
        // -Pshots, -Ponly, -Pwindow and -Pmemory, passed by the scripts in tools/ rather than typed.
        runs {
            configureEach {
                if (project.hasProperty("spike")) property("trmt.spike", "true")
                if (project.hasProperty("walk")) property("trmt.spike.walk", "true")
                if (project.hasProperty("shots")) property("trmt.spike.shots", "true")
                if (project.hasProperty("only")) property("trmt.spike.only", project.property("only").toString())
                // An older edition's walk world in run/saves, opened instead of making one (0.9.225, spike 3).
                if (project.hasProperty("upgrade")) property("trmt.spike.upgrade", project.property("upgrade").toString())
                if (project.hasProperty("window") && name.toLowerCase().contains("client")) {
                    def size = project.property("window").toString().split("x")
                    programArgs("--width", size[0], "--height", size[1])
                }
                if (project.hasProperty("memory")) {
                    vmArgs("-Xmx" + project.property("memory") + "m", "-Xms512m")
                }
            }
        }
    }

    // Every @Redirect's `at` written as one annotation, never as a list of one (0.9.228, step 9; Xep, told the Fabric
    // jars crashed at startup on every Fabric Loader before 0.19.5: "if we can do the mixins in a way where it
    // satisfies old and new, that would be the most ideal"). Fabric's Mixin from 0.17.4 - which Fabric Loader 0.19.5
    // and NeoForge's newer builds bring - declares Redirect.at as At[] where every Mixin before it declared one At, so
    // javac compiling against it writes each @Redirect's `at` as an array. The MixinExtras older loaders bundle (0.5.0
    // to 0.5.4: Fabric Loader 0.17 to 0.19.4, NeoForge before 26.1.2.114 on 26.1.2) read that value as one annotation in
    // FactoryRedirectWrapperMixinTransformer, and the game dies before its window with "ArrayList cannot be cast to
    // AnnotationNode". Compiled against 0.17.3, the last whose Redirect.at is one At, the value is one annotation, which
    // every reader takes: every Mixin asks for it as a list and wraps a single one (InjectionInfo), and MixinExtras 0.5.5
    // does the same. Only what javac and the annotation processor see is moved; the game runs on whatever Mixin its
    // loader brings. RedirectAtIsOneAnnotationTest reads every module's classes for it.
    configurations.configureEach {
        def named = name.toLowerCase()
        if (named.endsWith("compileclasspath") || named.contains("annotationprocessor")) {
            resolutionStrategy.force "net.fabricmc:sponge-mixin:0.17.3+mixin.0.8.7"
        }
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        mappings loom.layered() {
            officialMojangMappings()
            parchment("org.parchmentmc.data:parchment-${rootProject.parchment_minecraft}:${rootProject.parchment_version}@zip")
        }
    }
}

allprojects {
    apply plugin: "java"
    apply plugin: "architectury-plugin"
    apply plugin: "maven-publish"

    base {
        archivesName = "trmtr-${rootProject.minecraft_version}"
    }
    // A VERSION in the environment overrides gradle.properties, as in every other edition: it is how a snapshot's
    // early build is stamped with its own name without a tracked file changing.
    version = System.getenv("VERSION") ?: rootProject.mod_version
    group = rootProject.mod_group

    repositories {
        // Each narrowed to the group it is there for: a repository asked for every dependency can slow or break a
        // build it has nothing to do with.
        maven {
            url = "https://maven.parchmentmc.org"
            content { includeGroup "org.parchmentmc.data" }
        }
        maven {
            url = "https://maven.shedaniel.me/"
            content { includeGroup "me.shedaniel.cloth" }
        }
        maven {
            url = "https://maven.terraformersmc.com/releases"
            content { includeGroup "com.terraformersmc" }
        }
        maven {
            url = "https://maven.minecraftforge.net/"
            content { includeGroup "io.github.llamalad7" }
        }
        // Modrinth's own Maven, for the tooltip mods this edition writes lines into - an official source, as the
        // downloads for 0.9.225 were decided (Modrinth, CurseForge's CDN, the loaders' own Mavens).
        maven {
            url = "https://api.modrinth.com/maven"
            content { includeGroup "maven.modrinth" }
        }
    }

    // The portable core is Java 8 source, byte for byte with 1.7.10's; the rest of this edition is Java 17, the
    // version 1.20.1 runs on.
    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        options.release = 17
        // Every error at once rather than the compiler's first hundred, while the carry from 1.16.5 is being made.
        options.compilerArgs += ["-Xmaxerrs", "100000"]
    }

    java {
        withSourcesJar()
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    tasks.withType(JavaExec).configureEach {
        javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }
}

// RedirectAtIsOneAnnotationTest reads the classes of every module, not common's alone, so the loader modules are
// compiled before common's tests run - or the guard would read an empty folder and pass.
project(":common") {
    tasks.named("test") {
        dependsOn(rootProject.subprojects.findAll { it.name != "common" }.collect { it.path + ":classes" })
    }
}
