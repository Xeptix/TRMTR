// The Forge jar, for Forge 47 on Minecraft 1.20.1. The Fabric module's opposite number, and the same shape.

plugins {
    id "com.gradleup.shadow"
}

architectury {
    forge()
}

loom {
    forge {
        mixinConfig "trmtgtnh-common.mixins.json"
        mixinConfig "trmtgtnh-forge.mixins.json"
    }
    mixin {
        defaultRefmapName = "trmtgtnh-forge-refmap.json"
    }
}

configurations {
    common
    shadowBundle
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common
}

dependencies {
    forge "net.minecraftforge:forge:${rootProject.minecraft_version}-${rootProject.forge_version}"

    // MixinExtras, inside this jar (decided 2026-10-13: "Bundle it in the jar"). Forge 47 does not carry it, and a
    // player installs nothing extra; MIT-licensed, and made to be shipped this way. include() is Loom's jar-in-jar.
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:${rootProject.mixinextras_version}"))
    implementation(include("io.github.llamalad7:mixinextras-forge:${rootProject.mixinextras_version}"))

    // The One Probe, the block tooltip whose API is this loader's alone, compile only: an optional integration,
    // named only in its own class, which nothing loads unless the mod is installed. Jade's and WTHIT's plugins are
    // the common module's from 0.9.226.
    modCompileOnly "maven.modrinth:the-one-probe:${rootProject.top_version}"

    // Cloth Config, whose screen is the other of this mod's two - optional from 0.9.228 (decided), and kept on the
    // development run so the rig can photograph both screens. See ConfigScreens.
    modImplementation("me.shedaniel.cloth:cloth-config-forge:${rootProject.cloth_version}") {
        exclude group: "net.fabricmc"
        exclude group: "net.fabricmc.fabric-api"
    }

    // Distant Horizons' API, compile only and never shipped (0.9.229 W6 T17, as the Fabric module's): that mod is
    // LGPL-3.0, and the plugin that names it (com.trmtgtnh.forge.dh) is loaded only where a player has it installed.
    // From Modrinth's Maven; 7.2.0 is the API inside DistantHorizons-3.3.3-1.20.1-fabric-forge.jar, one jar for both.
    compileOnly "maven.modrinth:distanthorizonsapi:${rootProject.distanthorizons_api_version}"

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowBundle project(path: ":common", configuration: "transformProductionForge")
}

processResources {
    inputs.property "version", project.version
    filesMatching("META-INF/mods.toml") {
        expand version: project.version
    }

    // The licences travel in the jar, copied from the repository root rather than kept as a second copy.
    from(rootProject.projectDir) {
        include 'LICENSE.md'
        include 'LICENSE_trmt'
        include 'ATTRIBUTION.md'
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "dev-shadow"
}

remapJar {
    inputFile.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier = "forge"
}

// ---------------------------------------------------------------------------
// The TRMTR API's example mod, on the development runs only
// ---------------------------------------------------------------------------
//
// The example mod (0.9.229, W3 spec 2.8, carried in T18) lives in the 1.7.10 tree's api/example/: its portable plugin
// and data in common/, and this loader's one registration class in 1.20.1/forge/. That tree is found through the
// untracked sibling.properties at the root: its apiHome line where one is given (a worktree names its own 1.7.10
// worktree there), otherwise by following otherEdition to the tree each names in turn. Where neither leads to the folder, this tree and its public repository build exactly as before. It is a source
// set of its own so that nothing a shipped jar takes - shadowJar and remapJar read the main source set and the common
// module alone - can reach it, and its jar is written to build/example/, outside build/libs, where staging and the jar
// checks look. It compiles against the game and TRMTR's classes because the dev run needs both on one classpath; that
// it uses nothing of TRMTR's but trmtr-api, and that no shipped jar holds it, are checked by guards in the 1.7.10
// tree's tools.
//
// Forge 47 loads a second mod in development from the run's classpath: its ClasspathLocator (fmlloader 1.20.1-47.4.27,
// net/minecraftforge/fml/loading/moddiscovery/ClasspathLocator) takes every jar on the class path holding
// META-INF/mods.toml, outside its legacyClassPath, as a mod file of its own, on a launch target with "dev" in its name,
// and skips directories, which is why the example goes on as a jar. TRMTR then reads its plugin.json and data from that
// jar as it would a player's.
def exampleHome = null
def exampleTrees = []
def exampleFirst = rootProject.file('sibling.properties')
if (exampleFirst.exists()) {
    Properties heldForExample = new Properties()
    exampleFirst.withInputStream { heldForExample.load(it) }
    String apiTree = heldForExample.getProperty('apiHome', '').trim()
    if (!apiTree.isEmpty()) exampleTrees << new File(apiTree)
    // otherEdition, then the tree each one names in turn, a few steps at most: 1.20.1 names 1.7.10.
    String olderTree = heldForExample.getProperty('otherEdition', '').trim()
    for (int step = 0; step < 3 && !olderTree.isEmpty(); step++) {
        File older = rootProject.file(olderTree)
        exampleTrees << older
        File olderSibling = new File(older, 'sibling.properties')
        olderTree = ''
        if (olderSibling.exists()) {
            Properties olderHeld = new Properties()
            olderSibling.withInputStream { olderHeld.load(it) }
            olderTree = olderHeld.getProperty('otherEdition', '').trim()
        }
    }
}
for (File tree : exampleTrees) {
    if (exampleHome == null && new File(tree, 'api/example/1.20.1/forge').isDirectory()) {
        exampleHome = new File(tree, 'api/example')
    }
}
if (exampleHome != null) {
    sourceSets {
        example {
            java.srcDirs = [new File(exampleHome, 'common/java'), new File(exampleHome, '1.20.1/forge/java')]
            resources.srcDirs = [new File(exampleHome, 'common/resources'), new File(exampleHome, '1.20.1/forge/resources')]
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        }
    }

    def exampleJar = tasks.register('exampleJar', Jar) {
        description = 'The TRMTR API example mod, for the development runs only.'
        from(sourceSets.example.output)
        archiveFileName.set('example-1.20.1-forge.jar')
        destinationDirectory.set(layout.buildDirectory.dir('example'))
    }

    // Loom's run tasks keep a classpath of their own, and classpath() adds to it whether the run goes by an argument
    // file or a bare class path (architectury-loom 1.7's AbstractRunTask).

    // R3's client is a real game under this loader's own names, so the blocks-only copy it is given is made from the
    // example remapped to them (tools/api_server.py; a development jar's names crash a real game, as 1.7.10's did in
    // the example's preInit). Beside the development jar, under a name of its own, never in build/libs, and built by
    // runServer, the task api_server.py runs.
    def exampleRemap = tasks.register('remapExampleJar', net.fabricmc.loom.task.RemapJarTask) {
        description = 'The TRMTR API example mod under the names a real game runs with, for R3 only.'
        dependsOn exampleJar
        inputFile.set(exampleJar.flatMap { it.archiveFile })
        archiveFileName.set('example-1.20.1-forge-remapped.jar')
        destinationDirectory.set(layout.buildDirectory.dir('example'))
    }

    ['runClient', 'runServer'].each { taskName ->
        tasks.matching { it.name == taskName }.configureEach { JavaExec task ->
            task.dependsOn(exampleJar)
            if (taskName == 'runServer') task.dependsOn(exampleRemap)
            task.classpath(exampleJar)
        }
    }
}
