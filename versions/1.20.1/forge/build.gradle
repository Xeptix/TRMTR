// The Forge jar, for Forge 47 on Minecraft 1.20.1. The Fabric module's opposite number, and the same shape.

plugins {
    id "com.gradleup.shadow"
}

architectury {
    forge()
}

loom {
    forge {
        mixinConfig "trmtgtnh-common.mixins.json"
        mixinConfig "trmtgtnh-forge.mixins.json"
    }
    mixin {
        defaultRefmapName = "trmtgtnh-forge-refmap.json"
    }
}

configurations {
    common
    shadowBundle
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common
}

dependencies {
    forge "net.minecraftforge:forge:${rootProject.minecraft_version}-${rootProject.forge_version}"

    // MixinExtras, inside this jar (decided 2026-10-13: "Bundle it in the jar"). Forge 47 does not carry it, and a
    // player installs nothing extra; MIT-licensed, and made to be shipped this way. include() is Loom's jar-in-jar.
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:${rootProject.mixinextras_version}"))
    implementation(include("io.github.llamalad7:mixinextras-forge:${rootProject.mixinextras_version}"))

    // The One Probe, the block tooltip whose API is this loader's alone, compile only: an optional integration,
    // named only in its own class, which nothing loads unless the mod is installed. Jade's and WTHIT's plugins are
    // the common module's from 0.9.226.
    modCompileOnly "maven.modrinth:the-one-probe:${rootProject.top_version}"

    // Cloth Config, whose screen is the other of this mod's two - optional from 0.9.228 (decided), and kept on the
    // development run so the rig can photograph both screens. See ConfigScreens.
    modImplementation("me.shedaniel.cloth:cloth-config-forge:${rootProject.cloth_version}") {
        exclude group: "net.fabricmc"
        exclude group: "net.fabricmc.fabric-api"
    }

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowBundle project(path: ":common", configuration: "transformProductionForge")
}

processResources {
    inputs.property "version", project.version
    filesMatching("META-INF/mods.toml") {
        expand version: project.version
    }

    // The licences travel in the jar, copied from the repository root rather than kept as a second copy.
    from(rootProject.projectDir) {
        include 'LICENSE.md'
        include 'LICENSE_trmt'
        include 'ATTRIBUTION.md'
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "dev-shadow"
}

remapJar {
    inputFile.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier = "forge"
}
