modLoader = "javafml"
loaderVersion = "[47,)"
license = "CC BY-NC 4.0"
issueTrackerURL = "https://github.com/Xeptix/TRMTR/issues"

[[mods]]
modId = "trmtgtnh"
version = "${version}"
displayName = "TRMT: Reimagined"
displayURL = "https://github.com/Xeptix/TRMTR"
authors = "Xeptix"
credits = "This version by Xep. Based on The Roads More Travelled by milkucha (https://github.com/milkucha/trmt), Copyright (c) 2026 milkucha, licensed CC BY-NC 4.0 (https://creativecommons.org/licenses/by-nc/4.0/) - see LICENSE_trmt for the full text and its disclaimer of warranties in Section 5. This is a modified work: carried to Forge and Fabric 1.20.1 by way of 1.7.10, 1.12.2 and 1.16.5 and re-architected so wear is server-side data painted client-side. Unofficial and non-commercial; not produced, endorsed or supported by milkucha. Full notice in LICENSE.md and ATTRIBUTION.md."
description = '''
Ground wears into paths along the routes you actually walk, and grows back once you stop using them.

Wear is kept as server-side data and painted on your client as ghost blocks. No block is ever written
into the world, so this can be switched off for one player, disabled across a server, or deleted
outright without a square of terrain having changed.
'''

[[dependencies.trmtgtnh]]
    modId = "forge"
    mandatory = true
    versionRange = "[47,)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.trmtgtnh]]
    modId = "minecraft"
    mandatory = true
    versionRange = "[1.20.1,1.20.2)"
    ordering = "NONE"
    side = "BOTH"

# Cloth Config, which the settings screen is built on. Forge dropped GuiConfig at 1.13 and vanilla
# has never had a settings screen for a mod, so this is the port's one deliberate new dependency -
# and declaring it is the difference between a loader that says what is missing and a Config button
# that throws NoClassDefFoundError when it is pressed.
#
# CLIENT rather than BOTH, because nothing outside the screen names it: a dedicated server needs
# neither the screen nor this mod. The Fabric side has no way to say that - its depends apply to
# both environments - so it declares cloth-config outright, which is safe because that mod is not
# client-only and loads on a dedicated server.
#
# cloth_config, with an underscore: from Forge 1.17 a mod id may hold no hyphen, and Cloth's Forge jar
# renamed itself. The floor is set as every jar's is, by trying older ones in a game
# (docs/DEPENDENCY-FLOORS.md in the 1.7.10 tree): Cloth 11.0.99, the oldest build for 1.20.1, ran the
# whole harness clean on 2026-10-13, so the range admits all of Cloth 11.
[[dependencies.trmtgtnh]]
    modId = "cloth_config"
    mandatory = true
    versionRange = "[11.0,)"
    ordering = "NONE"
    side = "CLIENT"
