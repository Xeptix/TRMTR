modLoader = "javafml"
loaderVersion = "[4,)"
license = "CC BY-NC 4.0"
issueTrackerURL = "https://github.com/Xeptix/TRMTR/issues"

[[mods]]
modId = "trmtgtnh"
version = "${version}"
displayName = "TRMT: Reimagined"
displayURL = "https://github.com/Xeptix/TRMTR"
authors = "Xeptix"
credits = "This version by Xep. Based on The Roads More Travelled by milkucha (https://github.com/milkucha/trmt), Copyright (c) 2026 milkucha, licensed CC BY-NC 4.0 (https://creativecommons.org/licenses/by-nc/4.0/) - see LICENSE_trmt for the full text and its disclaimer of warranties in Section 5. This is a modified work: carried to NeoForge, Forge and Fabric 26.1.2 by way of 1.7.10, 1.12.2, 1.16.5, 1.20.1 and 1.21.1 and re-architected so wear is server-side data painted client-side. Unofficial and non-commercial; not produced, endorsed or supported by milkucha. Full notice in LICENSE.md and ATTRIBUTION.md."
description = '''
Ground wears into paths along the routes you actually walk, and grows back once you stop using them.

Wear is kept as server-side data and painted on your client as ghost blocks. No block is ever written
into the world, so this can be switched off for one player, disabled across a server, or deleted
outright without a square of terrain having changed.
'''

# NeoForge reads a mod's mixin configs from here, where Forge took them from the jar's manifest (which Architectury
# Loom writes from loom.forge.mixinConfig in the Forge module's build). The shared module's first, as the Forge build
# names them.
[[mixins]]
config = "trmtgtnh-common.mixins.json"

[[mixins]]
config = "trmtgtnh-neoforge.mixins.json"

[[dependencies.trmtgtnh]]
    modId = "neoforge"
    type = "required"
    # The oldest NeoForge played with this jar, 0.9.228's floors (docs/DEPENDENCY-FLOORS.md in the 1.7.10 tree);
    # built against 26.1.2.122 (gradle.properties). DeclaredFloorsAreTheFoundOnesTest holds it.
    versionRange = "[26.1.2.71,)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.trmtgtnh]]
    modId = "minecraft"
    type = "required"
    versionRange = "[26.1.2,26.1.3)"
    ordering = "NONE"
    side = "BOTH"

# Cloth Config, which the settings screen is built on. Forge dropped GuiConfig at 1.13 and vanilla
# has never had a settings screen for a mod. On 1.21.1 this jar required it on a client; on 26.x it is
# optional (decided): a game without it starts, and the Config button asks ConfigScreens, which builds
# Cloth's screen only where Cloth is loaded. Declared optional rather than left out, so a Cloth too old
# for this game is refused by the loader, by name, rather than met at the button.
#
# CLIENT rather than BOTH, because nothing outside the screen names it. cloth_config, with an
# underscore: from Forge 1.17 a mod id may hold no hyphen, and Cloth's NeoForge jar keeps its Forge
# jar's id. The floor is set as every jar's is, by trying older ones in a game
# (docs/DEPENDENCY-FLOORS.md in the 1.7.10 tree). For 26.1.2 that is still to be tried: the range
# admits Cloth 26.1, the line built for this game (gradle.properties), until it has been.
[[dependencies.trmtgtnh]]
    modId = "cloth_config"
    type = "optional"
    versionRange = "[26.1,)"
    ordering = "NONE"
    side = "CLIENT"
