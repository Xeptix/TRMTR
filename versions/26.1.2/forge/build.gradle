// The Forge jar, for Forge 64 on Minecraft 26.1.2 - its shadow jar, with the common module folded in. Outside
// Architectury's template, as at 1.21.1; Loom's own tests build Forge at 26.1 and 26.2 under the no-remap plugin. If it
// will not build or launch here, the fallback Xep chose is a ForgeGradle 7 module beside the others.

plugins {
    id "com.gradleup.shadow"
}

architectury {
    platformSetupLoomIde()
    forge()
}

loom {
    // The shared access widener, turned into Forge's access transformer for this jar and applied in the dev run, as
    // at 1.21.1.
    accessWidenerPath = project(":common").loom.accessWidenerPath
    forge {
        // Registered as Architectury's no-remap Forge does it - in the manifest it writes and in the dev run - with no
        // refmap: nothing is remapped from 26.1, so the configs carry no "refmap" key.
        mixinConfig "trmtgtnh-common.mixins.json"
        mixinConfig "trmtgtnh-forge.mixins.json"
        // Converted on the shadow jar, which is the one holding the common module's resources and so the widener - the
        // plain jar holds this module's alone, and 1.21.1's conversion (convertAccessWideners = true) ran on it and
        // stopped the build, "Could not find AW 'trmtgtnh.accesswidener' to convert into AT". NeoForge's module does
        // the same.
        convertAccessWideners(tasks.named("shadowJar"), "trmtgtnh.accesswidener")
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    // Not runtimeClasspath, as 1.21.1's Forge module found (0.9.226): Forge's module layer refuses a package two modules
    // export, and a dev run then held the common module twice - its jar (trmtr.dev) and its classes folded into a
    // generated module - and stopped at start with "Modules generated_... and trmtr.dev export package com.trmtgtnh".
    developmentForge.extendsFrom common
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    forge "net.minecraftforge:forge:${rootProject.forge_version}"

    // MixinExtras is not carried inside the jar, unlike 1.21.1's: Forge 64's own userdev libraries hold mixinextras-forge
    // 0.5.4 (read from its userdev config, 0.9.227), so the game has it at run time. That config also names
    // mixinextras-common 0.5.4 as compile-only, which this Loom does not apply, so it is named here, at Forge's own
    // version, for the shared and Forge mixins that wrap an operation.
    compileOnly "io.github.llamalad7:mixinextras-common:0.5.4"

    // WTHIT's Forge build, compiled against only, as at 1.21.1: the tooltip plugin is the common module's and WTHIT
    // finds it through waila_plugins.json. Cloth Config has no Forge build at 26.1.2, so none is named here.
    compileOnly "maven.modrinth:wthit:${rootProject.wthit_forge_version}"

    common(project(path: ":common")) { transitive = false }
    shadowBundle project(path: ":common", configuration: "transformProductionForge")
}

processResources {
    inputs.property "version", project.version
    filesMatching("META-INF/mods.toml") {
        expand version: project.version
    }
    from(rootProject.projectDir) {
        include 'LICENSE.md'
        include 'LICENSE_trmt'
        include 'ATTRIBUTION.md'
    }
}

jar {
    archiveClassifier = "dev"
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "forge"
}

assemble.dependsOn shadowJar

// ---------------------------------------------------------------------------
// The TRMTR API's example mod, on the development runs only
// ---------------------------------------------------------------------------
//
// The example mod (0.9.229, W3 spec 2.8, carried in T19 and T20) lives in the 1.7.10 tree's api/example/: its portable plugin
// and data in common/, and this loader's one registration class in 26.1.2/forge/. That tree is found through the
// untracked sibling.properties at the root: its apiHome line where one is given (a worktree names its own 1.7.10
// worktree there), otherwise by following otherEdition to the tree each names in turn. Where neither leads to the
// folder, this tree and its public repository build exactly as before. It is a source set of its own so that nothing a shipped jar takes - shadowJar and remapJar read the main source set and the common
// module alone - can reach it, and its jar is written to build/example/, outside build/libs, where staging and the jar
// checks look. It compiles against the game and TRMTR's classes because the dev run needs both on one classpath; that
// it uses nothing of TRMTR's but trmtr-api, and that no shipped jar holds it, are checked by guards in the 1.7.10
// tree's tools.
//
// Forge 64 loads a second mod in development from the run's classpath: its ClasspathLocator (fmlloader 26.1.2-64.1.5,
// net/minecraftforge/fml/loading/moddiscovery/ClasspathLocator, read with javap) takes every class path entry holding
// META-INF/mods.toml, but for the game's own, as a mod file of its own. TRMTR then reads its plugin.json and data from
// that jar as it would a player's.
def exampleHome = null
def exampleTrees = []
def exampleFirst = rootProject.file('sibling.properties')
if (exampleFirst.exists()) {
    Properties heldForExample = new Properties()
    exampleFirst.withInputStream { heldForExample.load(it) }
    String apiTree = heldForExample.getProperty('apiHome', '').trim()
    if (!apiTree.isEmpty()) exampleTrees << new File(apiTree)
    // otherEdition, then the tree each one names in turn, a few steps at most: this tree names 1.7.10.
    String olderTree = heldForExample.getProperty('otherEdition', '').trim()
    for (int step = 0; step < 3 && !olderTree.isEmpty(); step++) {
        File older = rootProject.file(olderTree)
        exampleTrees << older
        File olderSibling = new File(older, 'sibling.properties')
        olderTree = ''
        if (olderSibling.exists()) {
            Properties olderHeld = new Properties()
            olderSibling.withInputStream { olderHeld.load(it) }
            olderTree = olderHeld.getProperty('otherEdition', '').trim()
        }
    }
}
for (File tree : exampleTrees) {
    if (exampleHome == null && new File(tree, 'api/example/26.1.2/forge').isDirectory()) {
        exampleHome = new File(tree, 'api/example')
    }
}
if (exampleHome != null) {
    sourceSets {
        example {
            java.srcDirs = [new File(exampleHome, 'common/java'), new File(exampleHome, '26.1.2/forge/java')]
            resources.srcDirs = [new File(exampleHome, 'common/resources'), new File(exampleHome, '26.1.2/forge/resources')]
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        }
    }

    def exampleJar = tasks.register('exampleJar', Jar) {
        description = 'The TRMTR API example mod, for the development runs only.'
        from(sourceSets.example.output)
        archiveFileName.set('example-26.1.2-forge.jar')
        destinationDirectory.set(layout.buildDirectory.dir('example'))
    }

    // Nothing is remapped from 26.1 (the root build file), so this jar is under the names a real game runs with, Mojang's,
    // on all three loaders, and needs no second one as 1.21.1's Fabric does.

    // Loom's run tasks keep a classpath of their own, and classpath() adds to it whether the run goes by an argument
    // file or a bare class path (architectury-loom 1.17's AbstractRunTask, getInternalClasspath).

    ['runClient', 'runServer'].each { taskName ->
        tasks.matching { it.name == taskName }.configureEach { JavaExec task ->
            task.dependsOn(exampleJar)
            task.classpath(exampleJar)
        }
    }
}
