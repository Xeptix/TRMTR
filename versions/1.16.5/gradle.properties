# The versions in the Prism instances this is tested against:
#   X:\Prism\instances\1.16.5 Forge    Minecraft 1.16.5, Forge 36.2.34
#   X:\Prism\instances\1.16.5 Fabric   Minecraft 1.16.5, Fabric Loader 0.19.5
